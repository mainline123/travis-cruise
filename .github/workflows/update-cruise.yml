name: Update Cruise Schedule

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-cruise:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Port Charlottetown cruise schedule
        run: node update-cruise.js

      - name: Commit updated cruise data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cruise-data.json

          if git diff --cached --quiet; then
            echo "No cruise data changes to commit"
          else
            git commit -m "Automatic Port Charlottetown cruise schedule update"
            git pull --rebase origin main
            git push origin main
          fi
