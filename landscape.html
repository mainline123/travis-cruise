<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jamaica Cruise Traffic Dashboard - Landscape</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #071b2b 0%, #0b3046 55%, #0d4158 100%);
    color: white;
}

body {
    display: flex;
    flex-direction: column;
    padding: 12px 24px 8px;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 105px;
    flex-shrink: 0;
    border-bottom: 2px solid rgba(255,255,255,0.16);
    padding-bottom: 10px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 18px;
}

.logo {
    width: 100px;
    height: 72px;
    object-fit: contain;
    background: white;
    border-radius: 9px;
    padding: 6px;
}

.title-block h1 {
    font-size: clamp(28px, 2.6vw, 48px);
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1;
}

.title-block p {
    margin-top: 7px;
    color: #b9d8e5;
    font-size: clamp(13px, 1.1vw, 20px);
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.clock {
    text-align: right;
}

#time {
    font-size: clamp(28px, 2.8vw, 50px);
    font-weight: 800;
}

#date {
    margin-top: 3px;
    color: #b9d8e5;
    font-size: clamp(13px, 1.1vw, 19px);
}

/* SUMMARY */

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    height: 105px;
    flex-shrink: 0;
    padding: 10px 0;
}

.card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 8px 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.card .number {
    font-size: clamp(26px, 2.5vw, 44px);
    font-weight: 800;
    line-height: 1;
}

.card .label {
    margin-top: 5px;
    color: #b9d8e5;
    font-size: clamp(11px, 0.9vw, 16px);
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* TABLE */

.board {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: rgba(0,0,0,0.17);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 12px;
    overflow: hidden;
}

.table-header,
.row {
    display: grid;
    grid-template-columns:
        0.9fr
        1.25fr
        0.75fr
        2.55fr
        0.75fr
        0.8fr
        1fr;
    align-items: center;
    column-gap: 10px;
}

.table-header {
    height: 42px;
    flex-shrink: 0;
    padding: 0 20px;
    background: rgba(0,0,0,0.32);
    color: #a9d5e6;
    font-size: clamp(11px, 0.9vw, 16px);
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.7px;
}

#rows {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-rows: repeat(10, 1fr);
    overflow: hidden;
}

.row {
    min-height: 0;
    padding: 3px 20px;
    border-top: 1px solid rgba(255,255,255,0.09);
    font-size: clamp(12px, 1vw, 18px);
}

.row:nth-child(even) {
    background: rgba(255,255,255,0.035);
}

/* SHIP + CRUISE LINE LOGO */

.ship {
    font-weight: 800;
    font-size: clamp(13px, 1.1vw, 20px);
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.cruise-logo-box {
    width: 72px;
    height: 40px;
    flex: 0 0 72px;
    background: white;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3px;
    overflow: hidden;
}

.cruise-logo {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.ship-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.port {
    font-weight: 700;
    color: #9eddf1;
}

.guests {
    font-weight: 700;
}

.status {
    display: inline-block;
    width: fit-content;
    padding: 4px 10px;
    border-radius: 16px;
    font-size: clamp(10px, 0.75vw, 14px);
    font-weight: bold;
    text-transform: uppercase;
    white-space: nowrap;
}

.status-upcoming {
    background: #1976d2;
}

.status-today {
    background: #148b72;
}

.status-inport {
    background: #138a4a;
}

.empty {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #b9d8e5;
    font-size: clamp(20px, 1.8vw, 32px);
    font-weight: bold;
}

/* FOOTER */

.footer {
    height: 30px;
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #91b6c5;
    font-size: clamp(10px, 0.8vw, 14px);
}

.live {
    display: flex;
    align-items: center;
    gap: 7px;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #2bd17e;
    box-shadow: 0 0 8px #2bd17e;
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">

        <img src="logo.png" class="logo" alt="Virtual Media Masters">

        <div class="title-block">
            <h1>JAMAICA CRUISE TRAFFIC</h1>
            <p>Upcoming Cruise Arrivals Across Jamaica</p>
        </div>

    </div>

    <div class="clock">
        <div id="time">--:--</div>
        <div id="date">Loading...</div>
    </div>

</header>

<section class="summary">

    <div class="card">
        <div class="number" id="shipCount">0</div>
        <div class="label">Upcoming Ships</div>
    </div>

    <div class="card">
        <div class="number" id="guestCount">0</div>
        <div class="label">Upcoming Guests</div>
    </div>

    <div class="card">
        <div class="number" id="portCount">0</div>
        <div class="label">Active Ports</div>
    </div>

</section>

<main class="board">

    <div class="table-header">
        <div>Date</div>
        <div>Port</div>
        <div>Arrival</div>
        <div>Ship</div>
        <div>Departure</div>
        <div>Guests</div>
        <div>Status</div>
    </div>

    <div id="rows">
        <div class="empty">Loading Jamaica cruise schedule...</div>
    </div>

</main>

<footer class="footer">

    <div class="live">
        <span class="dot"></span>
        <span>LIVE JAMAICA CRUISE SCHEDULE</span>
    </div>

    <div>
        Last Updated:
        <span id="lastUpdated">--</span>
    </div>

</footer>

<script>

const DATA_URL = "cruise-data.json";
const REFRESH_INTERVAL = 15 * 60 * 1000;
const TIME_ZONE = "America/Jamaica";
const MAX_SHIPS = 10;


/* =====================================================
   CRUISE LINE LOGOS
===================================================== */

const CRUISE_LINES = [

    {
        logo: "logos/royal-caribbean.png",
        keywords: [
            "royal caribbean",
            "icon of the seas",
            "wonder of the seas",
            "utopia of the seas",
            "star of the seas",
            "oasis of the seas",
            "allure of the seas",
            "harmony of the seas",
            "symphony of the seas",
            "odyssey of the seas",
            "independence of the seas",
            "freedom of the seas",
            "liberty of the seas",
            "adventure of the seas",
            "explorer of the seas",
            "voyager of the seas",
            "mariner of the seas",
            "navigator of the seas",
            "radiance of the seas",
            "brilliance of the seas",
            "serenade of the seas",
            "jewel of the seas",
            "vision of the seas",
            "rhapsody of the seas",
            "grandeur of the seas",
            "enchantment of the seas"
        ]
    },

    {
        logo: "logos/carnival.png",
        keywords: [
            "carnival"
        ]
    },

    {
        logo: "logos/msc.png",
        keywords: [
            "msc"
        ]
    },

    {
        logo: "logos/norwegian.png",
        keywords: [
            "norwegian",
            "ncl"
        ]
    },

    {
        logo: "logos/celebrity.png",
        keywords: [
            "celebrity"
        ]
    },

    {
        logo: "logos/disney.png",
        keywords: [
            "disney"
        ]
    },

    {
        logo: "logos/princess.png",
        keywords: [
            "princess"
        ]
    },

    {
        logo: "logos/holland-america.png",
        keywords: [
            "holland america",
            "nieuw amsterdam",
            "nieuw statendam",
            "rotterdam",
            "eurodam",
            "zuiderdam",
            "oosterdam",
            "westerdam",
            "noordam",
            "koningsdam",
            "volendam",
            "zaandam"
        ]
    },

    {
        logo: "logos/virgin-voyages.png",
        keywords: [
            "virgin voyages",
            "scarlet lady",
            "valiant lady",
            "resilient lady",
            "brilliant lady"
        ]
    },

    {
        logo: "logos/viking.png",
        keywords: [
            "viking",
            "viking mars",
            "viking sea",
            "viking sky",
            "viking star",
            "viking sun",
            "viking venus",
            "viking jupiter",
            "viking neptune",
            "viking saturn",
            "viking vela"
        ]
    }

];


function getCruiseLogo(shipName) {

    if (!shipName) {
        return null;
    }

    const ship =
        String(shipName)
            .toLowerCase()
            .trim();

    for (const cruiseLine of CRUISE_LINES) {

        const match =
            cruiseLine.keywords.some(
                keyword =>
                    ship.includes(keyword)
            );

        if (match) {
            return cruiseLine.logo;
        }
    }

    return null;
}


function buildShipDisplay(shipName) {

    const name =
        shipName || "—";

    const logo =
        getCruiseLogo(name);

    if (!logo) {

        return `
            <div class="ship">
                <span class="ship-name">
                    ${name}
                </span>
            </div>
        `;
    }

    return `
        <div class="ship">

            <div class="cruise-logo-box">

                <img
                    src="${logo}"
                    class="cruise-logo"
                    alt=""
                    onerror="this.parentElement.style.display='none';"
                >

            </div>

            <span class="ship-name">
                ${name}
            </span>

        </div>
    `;
}


/* =====================================================
   DATE / TIME
===================================================== */

function getJamaicaDateString() {

    const parts = new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: TIME_ZONE,
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).formatToParts(new Date());

    const values = {};

    parts.forEach(part => {

        if (part.type !== "literal") {
            values[part.type] = part.value;
        }

    });

    return values.year + "-" +
           values.month + "-" +
           values.day;
}


function updateClock() {

    const now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleTimeString(
            "en-US",
            {
                timeZone: TIME_ZONE,
                hour: "numeric",
                minute: "2-digit",
                hour12: true
            }
        );

    document.getElementById("date").textContent =
        now.toLocaleDateString(
            "en-US",
            {
                timeZone: TIME_ZONE,
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );
}


function formatDate(dateString) {

    if (!dateString) return "—";

    const parts =
        dateString.split("-");

    if (parts.length !== 3) {
        return dateString;
    }

    const date =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );

    return date.toLocaleDateString(
        "en-US",
        {
            month: "short",
            day: "numeric"
        }
    );
}


function formatNumber(value) {

    return Number(
        value || 0
    ).toLocaleString("en-US");
}


function formatTime(time) {

    if (!time || time === "--:--") {
        return "—";
    }

    const match =
        String(time)
            .match(/^(\d{1,2}):(\d{2})$/);

    if (!match) {
        return time;
    }

    let hour =
        Number(match[1]);

    const minute =
        match[2];

    const period =
        hour >= 12
        ? "PM"
        : "AM";

    hour =
        hour % 12;

    if (hour === 0) {
        hour = 12;
    }

    return hour +
           ":" +
           minute +
           " " +
           period;
}


function timeToMinutes(time) {

    if (!time || time === "--:--") {
        return null;
    }

    const match =
        String(time)
            .match(/(\d{1,2}):(\d{2})/);

    if (!match) {
        return null;
    }

    return Number(match[1]) * 60 +
           Number(match[2]);
}


function getJamaicaMinutes() {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone: TIME_ZONE,
                hour: "2-digit",
                minute: "2-digit",
                hourCycle: "h23"
            }
        ).formatToParts(new Date());

    let hour = 0;
    let minute = 0;

    parts.forEach(part => {

        if (part.type === "hour") {
            hour = Number(part.value);
        }

        if (part.type === "minute") {
            minute = Number(part.value);
        }

    });

    return hour * 60 + minute;
}


/* =====================================================
   STATUS
===================================================== */

function getStatus(arrival) {

    const today =
        getJamaicaDateString();

    if (arrival.date > today) {

        return {
            text: "Upcoming",
            className: "status-upcoming"
        };

    }

    if (arrival.date < today) {

        return {
            text: "Completed",
            className: "status-upcoming"
        };

    }

    const currentMinutes =
        getJamaicaMinutes();

    const arrivalMinutes =
        timeToMinutes(
            arrival.arrivalTime
        );

    const departureMinutes =
        timeToMinutes(
            arrival.departureTime
        );

    if (
        arrivalMinutes !== null &&
        departureMinutes !== null &&
        currentMinutes >= arrivalMinutes &&
        currentMinutes <= departureMinutes
    ) {

        return {
            text: "In Port",
            className: "status-inport"
        };

    }

    return {
        text: "Today",
        className: "status-today"
    };
}


/* =====================================================
   DATA
===================================================== */

function flattenData(data) {

    const arrivals = [];

    if (!Array.isArray(data)) {
        return arrivals;
    }

    data.forEach(port => {

        if (port.recordType !== "port") {
            return;
        }

        if (!Array.isArray(port.upcomingArrivals)) {
            return;
        }

        port.upcomingArrivals.forEach(arrival => {

            arrivals.push({
                ...arrival,
                portName: port.name
            });

        });

    });

    return arrivals;
}


/* =====================================================
   RENDER
===================================================== */

function render(data) {

    const today =
        getJamaicaDateString();

    let arrivals =
        flattenData(data);

    arrivals =
        arrivals.filter(
            arrival =>
                arrival.date &&
                arrival.date >= today
        );

    arrivals.sort((a, b) => {

        if (a.date !== b.date) {

            return a.date
                .localeCompare(b.date);

        }

        return String(a.arrivalTime)
            .localeCompare(
                String(b.arrivalTime)
            );

    });

    const displayArrivals =
        arrivals.slice(
            0,
            MAX_SHIPS
        );

    const shipCount =
        displayArrivals.length;

    const guestCount =
        displayArrivals.reduce(
            (total, arrival) =>
                total +
                Number(
                    arrival.passengers || 0
                ),
            0
        );

    const activePorts =
        new Set(
            displayArrivals.map(
                arrival =>
                    arrival.portName
            )
        ).size;

    document.getElementById(
        "shipCount"
    ).textContent =
        formatNumber(shipCount);

    document.getElementById(
        "guestCount"
    ).textContent =
        formatNumber(guestCount);

    document.getElementById(
        "portCount"
    ).textContent =
        formatNumber(activePorts);

    const rows =
        document.getElementById(
            "rows"
        );

    if (displayArrivals.length === 0) {

        rows.innerHTML =
            `<div class="empty">
                No upcoming Jamaica cruise arrivals found.
             </div>`;

        return;
    }

    rows.innerHTML =

        displayArrivals
            .map(arrival => {

                const status =
                    getStatus(arrival);

                return `

                    <div class="row">

                        <div>
                            ${formatDate(arrival.date)}
                        </div>

                        <div class="port">
                            ${arrival.portName}
                        </div>

                        <div>
                            ${formatTime(arrival.arrivalTime)}
                        </div>

                        ${buildShipDisplay(
                            arrival.shipName
                        )}

                        <div>
                            ${formatTime(arrival.departureTime)}
                        </div>

                        <div class="guests">

                            ${
                                arrival.passengers
                                ? formatNumber(
                                    arrival.passengers
                                  )
                                : "—"
                            }

                        </div>

                        <div>

                            <span class="status ${status.className}">
                                ${status.text}
                            </span>

                        </div>

                    </div>

                `;

            })
            .join("");
}


/* =====================================================
   LOAD CRUISE DATA
===================================================== */

async function loadCruiseData() {

    try {

        const response =
            await fetch(
                `${DATA_URL}?t=${Date.now()}`,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }

        const data =
            await response.json();

        render(data);

        let scrapedAt =
            null;

        if (
            Array.isArray(data) &&
            data.length
        ) {

            scrapedAt =
                data
                    .map(
                        port =>
                            port.scrapedAt
                    )
                    .filter(Boolean)
                    .sort()
                    .pop();

        }

        if (scrapedAt) {

            document.getElementById(
                "lastUpdated"
            ).textContent =

                new Date(scrapedAt)
                    .toLocaleString(
                        "en-US",
                        {
                            timeZone: TIME_ZONE,
                            month: "short",
                            day: "numeric",
                            hour: "numeric",
                            minute: "2-digit",
                            hour12: true
                        }
                    );

        }

        else {

            document.getElementById(
                "lastUpdated"
            ).textContent =
                "Live";

        }

    }

    catch (error) {

        console.error(
            "Cruise data error:",
            error
        );

        document.getElementById(
            "rows"
        ).innerHTML =

            `<div class="empty">
                Cruise schedule temporarily unavailable.
             </div>`;

    }
}


/* =====================================================
   START
===================================================== */

updateClock();

setInterval(
    updateClock,
    30000
);

loadCruiseData();

setInterval(
    loadCruiseData,
    REFRESH_INTERVAL
);

</script>

</body>
</html>
